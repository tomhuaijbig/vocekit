name: Qt 6 CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-qt6:
    runs-on: windows-2022
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run PowerShell release infrastructure tests
        shell: pwsh
        run: |
          & .\vocekit-qt6\tests\scripts\update-helper-tests.ps1
          & .\vocekit-qt6\scripts\tests\windows-speech-helper-build-tests.ps1
          & .\vocekit-qt6\scripts\tests\runtime-helper-provenance-tests.ps1
          & .\vocekit-qt6\scripts\tests\release-candidate-tests.ps1
          & .\vocekit-qt6\scripts\tests\finalize-release-candidate-tests.ps1
          & .\vocekit-qt6\scripts\tests\publish-finalized-release-tests.ps1
          $updateFeed = "https://api.github.com/repos/$env:GITHUB_REPOSITORY/releases/latest"
          & .\vocekit-qt6\scripts\verify-release-readiness.ps1 `
            -UpdateFeedUrl $updateFeed `
            -SkipGitState `
            -SkipAcceptance `
            -SkipAuthenticode `
            -SkipPublicFeed

      - name: Run Windows PowerShell 5.1 release compatibility tests
        shell: pwsh
        run: |
          & powershell.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File .\vocekit-qt6\tests\scripts\update-helper-tests.ps1
          if ($LASTEXITCODE -ne 0) { throw "Windows PowerShell 5.1 updater helper tests failed." }
          & powershell.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File .\vocekit-qt6\scripts\tests\windows-speech-helper-build-tests.ps1
          if ($LASTEXITCODE -ne 0) { throw "Windows PowerShell 5.1 speech helper tests failed." }
          & powershell.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File .\vocekit-qt6\scripts\tests\runtime-helper-provenance-tests.ps1
          if ($LASTEXITCODE -ne 0) { throw "Windows PowerShell 5.1 runtime helper provenance tests failed." }
          & powershell.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File .\vocekit-qt6\scripts\tests\release-candidate-tests.ps1
          if ($LASTEXITCODE -ne 0) { throw "Windows PowerShell 5.1 release candidate tests failed." }
          & powershell.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File .\vocekit-qt6\scripts\tests\finalize-release-candidate-tests.ps1
          if ($LASTEXITCODE -ne 0) { throw "Windows PowerShell 5.1 release finalization tests failed." }
          & powershell.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File .\vocekit-qt6\scripts\tests\publish-finalized-release-tests.ps1
          if ($LASTEXITCODE -ne 0) { throw "Windows PowerShell 5.1 verified-draft publisher tests failed." }

      - name: Install Qt 6.10.3 compatibility SDK and MinGW 13.1
        uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730 # v4.3.1
        with:
          version: 6.10.3
          arch: win64_mingw
          modules: qtmultimedia qtwebsockets
          tools: tools_mingw1310
          cache: true

      - name: Resolve toolchain
        shell: pwsh
        run: |
          $qmake = (Get-Command qmake.exe -ErrorAction Stop).Source
          $make = (Get-Command mingw32-make.exe -ErrorAction Stop).Source
          "QT_BIN=$([IO.Path]::GetDirectoryName($qmake))" | Out-File -FilePath $env:GITHUB_ENV -Append
          "MINGW_BIN=$([IO.Path]::GetDirectoryName($make))" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Restore pinned RapidOCR SDK cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: vocekit-qt6/Project_RapidOcrOnnx-1.2.2
          key: rapidocr-sdk-${{ runner.os }}-${{ hashFiles('vocekit-qt6/third_party/rapidocr/rapidocr-lock.json') }}

      - name: Prepare and verify pinned RapidOCR SDK
        shell: pwsh
        run: |
          & .\vocekit-qt6\scripts\fetch-rapidocr.ps1

      - name: Build Debug
        shell: pwsh
        run: |
          & .\vocekit-qt6\scripts\build.ps1 -Configuration debug -QtBin $env:QT_BIN -MingwBin $env:MINGW_BIN -Jobs 2

      - name: Build OCR helpers
        shell: pwsh
        run: |
          & .\vocekit-qt6\scripts\build-ocr-helpers.ps1 -Configuration Release

      - name: Run all Debug tests
        shell: pwsh
        run: |
          & .\vocekit-qt6\scripts\run-all-tests.ps1 -Configuration debug -QtBin $env:QT_BIN -MingwBin $env:MINGW_BIN

      - name: Build Release
        shell: pwsh
        run: |
          & .\vocekit-qt6\scripts\build.ps1 -Configuration release -QtBin $env:QT_BIN -MingwBin $env:MINGW_BIN -Jobs 2

name: Qt 6 Release Candidate

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  unsigned-release-candidate:
    runs-on: windows-2022
    timeout-minutes: 180
    permissions:
      contents: read
    env:
      CANDIDATE_NAME: vocekit-${{ github.run_id }}-unsigned-candidate
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install Qt 6.10.3 compatibility SDK and MinGW 13.1
        uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730 # v4.3.1
        with:
          version: 6.10.3
          arch: win64_mingw
          modules: qtmultimedia qtwebsockets
          tools: tools_mingw1310
          cache: true

      - name: Resolve toolchain and candidate update URL
        shell: pwsh
        run: |
          $qmake = (Get-Command qmake.exe -ErrorAction Stop).Source
          $make = (Get-Command mingw32-make.exe -ErrorAction Stop).Source
          "QT_BIN=$([IO.Path]::GetDirectoryName($qmake))" | Out-File -FilePath $env:GITHUB_ENV -Append
          "MINGW_BIN=$([IO.Path]::GetDirectoryName($make))" | Out-File -FilePath $env:GITHUB_ENV -Append
          "UPDATE_FEED=https://api.github.com/repos/$env:GITHUB_REPOSITORY/releases/latest" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Verify release-candidate source gates
        shell: pwsh
        run: |
          $expectedTag = if ($env:GITHUB_REF_TYPE -eq "tag") {
            $env:GITHUB_REF_NAME
          } else {
            ""
          }
          & .\vocekit-qt6\scripts\verify-release-readiness.ps1 `
            -UpdateFeedUrl $env:UPDATE_FEED `
            -ExpectedTag $expectedTag `
            -SkipAcceptance `
            -SkipAuthenticode

      - name: Preflight Release crash-handler regression
        id: crash_smoke
        timeout-minutes: 10
        shell: pwsh
        env:
          VOCEKIT_CRASH_TEST_ARTIFACT_ROOT: ${{ runner.temp }}\vocekit-crash-smoke
        run: |
          & .\vocekit-qt6\scripts\run-all-tests.ps1 -Configuration release -QtBin $env:QT_BIN -MingwBin $env:MINGW_BIN -ProjectName runtime_crash_handler_tests

      - name: Upload crash-handler diagnostics on failure
        if: ${{ failure() && steps.crash_smoke.outcome == 'failure' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: crash-handler-diagnostics-${{ github.run_id }}
          # Minidumps can contain process memory such as short-lived runner
          # credentials. Keep them on the ephemeral runner and upload only the
          # intentionally redacted metadata and text diagnostics.
          path: |
            ${{ runner.temp }}/vocekit-crash-smoke/**/*.json
            ${{ runner.temp }}/vocekit-crash-smoke/**/*.txt
            ${{ runner.temp }}/vocekit-crash-smoke/**/*.log
          if-no-files-found: warn
          retention-days: 7

      - name: Restore pinned RapidOCR SDK cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: vocekit-qt6/Project_RapidOcrOnnx-1.2.2
          key: rapidocr-sdk-${{ runner.os }}-${{ hashFiles('vocekit-qt6/third_party/rapidocr/rapidocr-lock.json') }}

      - name: Prepare pinned RapidOCR SDK and runtime helpers
        shell: pwsh
        run: |
          & .\vocekit-qt6\scripts\fetch-rapidocr.ps1
          & .\vocekit-qt6\scripts\build-runtime-helpers.ps1

      - name: Run all Release tests
        shell: pwsh
        run: |
          & .\vocekit-qt6\scripts\run-all-tests.ps1 -Configuration release -QtBin $env:QT_BIN -MingwBin $env:MINGW_BIN

      - name: Build and deploy unsigned candidate
        shell: pwsh
        run: |
          & .\vocekit-qt6\scripts\build.ps1 `
            -Configuration release `
            -QtBin $env:QT_BIN `
            -MingwBin $env:MINGW_BIN `
            -UpdateFeedUrl $env:UPDATE_FEED
          & .\vocekit-qt6\scripts\deploy.ps1 -QtBin $env:QT_BIN -MingwBin $env:MINGW_BIN
          & .\vocekit-qt6\scripts\package-test.ps1 -PackageName $env:CANDIDATE_NAME

      - name: Upload unsigned candidate for controlled testing only
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ env.CANDIDATE_NAME }}
          path: vocekit-qt6/dist/${{ env.CANDIDATE_NAME }}.zip
          if-no-files-found: error
          retention-days: 7

name: Qt 6 Release Candidate

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  unsigned-release-candidate:
    runs-on: windows-2022
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Install Qt 6.11.1 and MinGW 13.1
        uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730 # v4
        with:
          version: 6.11.1
          arch: win64_mingw
          tools: tools_mingw1310
          cache: true

      - name: Resolve toolchain and candidate update URL
        shell: pwsh
        run: |
          $qmake = (Get-Command qmake.exe -ErrorAction Stop).Source
          $make = (Get-Command mingw32-make.exe -ErrorAction Stop).Source
          "QT_BIN=$([IO.Path]::GetDirectoryName($qmake))" | Out-File -FilePath $env:GITHUB_ENV -Append
          "MINGW_BIN=$([IO.Path]::GetDirectoryName($make))" | Out-File -FilePath $env:GITHUB_ENV -Append
          "UPDATE_FEED=https://api.github.com/repos/${{ github.repository }}/releases/latest" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Verify release-candidate source gates
        shell: pwsh
        run: |
          $expectedTag = if ("${{ github.ref_type }}" -eq "tag") { "${{ github.ref_name }}" } else { "" }
          & .\vocekit-qt6\scripts\verify-release-readiness.ps1 `
            -UpdateFeedUrl $env:UPDATE_FEED `
            -ExpectedTag $expectedTag `
            -SkipAcceptance `
            -SkipAuthenticode

      - name: Run all Release tests
        shell: pwsh
        run: |
          & .\vocekit-qt6\scripts\run-all-tests.ps1 -Configuration release -QtBin $env:QT_BIN -MingwBin $env:MINGW_BIN

      - name: Build and deploy unsigned candidate
        shell: pwsh
        run: |
          & .\vocekit-qt6\scripts\build.ps1 `
            -Configuration release `
            -QtBin $env:QT_BIN `
            -MingwBin $env:MINGW_BIN `
            -UpdateFeedUrl $env:UPDATE_FEED
          & .\vocekit-qt6\scripts\deploy.ps1 -QtBin $env:QT_BIN -MingwBin $env:MINGW_BIN
          & .\vocekit-qt6\scripts\package-test.ps1 -PackageName "vocekit-${{ github.ref_name }}-unsigned-candidate"

      - name: Upload unsigned candidate for controlled testing only
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: vocekit-${{ github.ref_name }}-unsigned-candidate
          path: vocekit-qt6/dist/vocekit-${{ github.ref_name }}-unsigned-candidate.zip
          if-no-files-found: error
          retention-days: 7
